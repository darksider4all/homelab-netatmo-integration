# Re-enabled 2026-08-13 after GitHub auto-disabled for inactivity (60-day quiet repo).
# Workflow recreated 2026-08-13 to clear an orphaned run record that blocked scheduling.
name: HACS Validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

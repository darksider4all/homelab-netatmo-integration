name: Lint & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Ruff & mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Ruff lint
        run: ruff check custom_components tests
      - name: Ruff format check
        run: ruff format --check custom_components tests
      - name: mypy
        run: mypy custom_components/netatmo_custom

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pinned test stack (pytest-homeassistant-custom-component -> HA 2024.10.0)
        # depends on home-assistant-bluetooth==1.12.2, which is capped at Python <3.13.
        # That HA release only supports 3.12, so we test on the Python it actually runs on.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run pytest with coverage
        # Coverage gate: Bronze has no numeric rule, but the measurement
        # machinery must be in place for the Silver tier (>95) and the gate
        # keeps the floor at 90 in the meantime.
        run: pytest --cov=custom_components/netatmo_custom --cov-report=term-missing --cov-fail-under=90
